services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MCP_ALLOWED_HOSTS: "${FISCAL_DOMAIN:?Defina FISCAL_DOMAIN},127.0.0.1"
      MCP_ALLOWED_ORIGINS: "https://${FISCAL_DOMAIN}"
    volumes:
      - ../.data/public-corpus:/corpus:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    environment:
      FISCAL_DOMAIN: "${FISCAL_DOMAIN:?Defina FISCAL_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
