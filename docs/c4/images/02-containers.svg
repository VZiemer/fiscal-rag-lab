<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#54728c"/></marker><marker id="implements" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#f8fafc" stroke="#54728c"/></marker></defs>
<rect width="1600" height="1120" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="58" y="40" font-size="18" fill="#237c88" font-weight="700" text-anchor="start">C4 · LEVEL 2  /  FISCAL RAG LAB</text>
<text x="58" y="88" font-size="38" fill="#133653" font-weight="650" text-anchor="start">Containers and storage</text>
<text x="58" y="126" font-size="22" fill="#536b80" font-weight="400" text-anchor="start">Execution and data units. A C4 container does not mean a Docker container.</text>
<rect x="460" y="205" width="1080" height="800" rx="18" fill="#edf2f8" stroke="#9baec0" stroke-width="2" stroke-dasharray="10 7"/><text x="482" y="239" font-size="20" fill="#516b83" font-weight="600" text-anchor="start">Fiscal RAG Lab · system boundary</text>
<polyline points="380,420 500,420" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="220,320 220,170 1305,170 1305,300" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="920,460 1020,460 1020,710 1120,710" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="920,865 1120,865" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="500,865 380,865" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="60" y="320" width="320" height="180" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="84" y="360" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">MCP client / assistant</text><text x="84" y="390" font-size="19" fill="#506579" font-weight="400" text-anchor="start">External system</text><text x="84" y="432" font-size="17" fill="#263c50" font-weight="400" text-anchor="start">Conducts conversations, calls tools</text><text x="84" y="459" font-size="17" fill="#263c50" font-weight="400" text-anchor="start">and writes evidence-based answers.</text></g><g><rect x="60" y="755" width="320" height="200" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="84" y="795" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Official sources</text><text x="84" y="825" font-size="19" fill="#506579" font-weight="400" text-anchor="start">External system · HTTPS</text><text x="84" y="867" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Receita, NF-e, CONFAZ,</text><text x="84" y="894" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">SEFAZ-SP and SEF-MG.</text><text x="84" y="921" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Maintenance downloads.</text></g><g><rect x="500" y="320" width="420" height="230" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="524" y="360" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">MCP server + retrieval</text><text x="524" y="390" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Node.js 22 · TypeScript</text><text x="524" y="432" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">One process: protocol, queries</text><text x="524" y="459" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">and in-memory indexes.</text><text x="524" y="486" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Local: HTTP. AWS: Lambda.</text></g><g><rect x="500" y="755" width="420" height="220" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="524" y="795" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Ingestion worker</text><text x="524" y="825" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Node.js · maintenance CLI</text><text x="524" y="867" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Downloads, extracts and chunks.</text><text x="524" y="894" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Produces corpus.json and reports.</text><text x="524" y="921" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Runs separately from queries.</text></g><g><rect x="1120" y="650" width="370" height="240" rx="12" fill="#e2f3f1" stroke="#16766e" stroke-width="2"/><text x="1144" y="690" font-size="27" fill="#124942" font-weight="600" text-anchor="start">Versioned corpus</text><text x="1144" y="720" font-size="19" fill="#286e66" font-weight="400" text-anchor="start">JSON files + snapshots</text><text x="1144" y="762" font-size="20" fill="#124942" font-weight="400" text-anchor="start">Text, codes, metadata and hashes.</text><text x="1144" y="789" font-size="20" fill="#124942" font-weight="400" text-anchor="start">corpus.json is bundled with Lambda.</text><text x="1144" y="816" font-size="20" fill="#124942" font-weight="400" text-anchor="start">Not a remote vector database.</text></g><g><rect x="1120" y="300" width="370" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="1144" y="340" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Page and policy</text><text x="1144" y="370" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">HTML · S3 + CloudFront</text><text x="1144" y="412" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Static demo content.</text><text x="1144" y="439" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Does not execute MCP searches.</text></g><rect x="402.5" y="348" width="75" height="57" rx="6" fill="#f8fafc"/><text x="440" y="368" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">MCP</text><text x="440" y="393" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">HTTPS</text><rect x="665" y="150" width="230" height="32" rx="6" fill="#f8fafc"/><text x="780" y="170" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">HTTPS · page and policy</text><rect x="953" y="570" width="134" height="57" rx="6" fill="#f8fafc"/><text x="1020" y="590" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Reads corpus</text><text x="1020" y="615" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">at startup</text><rect x="947.5" y="805" width="145" height="57" rx="6" fill="#f8fafc"/><text x="1020" y="825" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Writes corpus</text><text x="1020" y="850" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">and snapshots</text><rect x="386" y="790" width="108" height="57" rx="6" fill="#f8fafc"/><text x="440" y="810" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Download</text><text x="440" y="835" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">HTTPS</text>
<line x1="58" y1="1055" x2="1542" y2="1055" stroke="#c9d6e2"/>
<text x="58" y="1090" font-size="20" fill="#536b80" font-weight="400" text-anchor="start">MCP and retrieval run together. Each server instance keeps BM25 and vectors in memory.</text>
</g></svg>