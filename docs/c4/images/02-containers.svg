<polyline points="380,420 500,420" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="220,320 220,170 1305,170 1305,300" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="920,460 1020,460 1020,710 1120,710" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="920,865 1120,865" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="500,865 380,865" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="60" y="320" width="320" height="180" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="84" y="360" font-size="25" fill="#263c50" font-weight="600" text-anchor="start">Cliente MCP / assistente</text><text x="84" y="390" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Sistema externo</text><text x="84" y="432" font-size="16" fill="#263c50" font-weight="400" text-anchor="start">Conduz a conversa, chama ferramentas</text><text x="84" y="459" font-size="16" fill="#263c50" font-weight="400" text-anchor="start">e redige a resposta com evidências.</text></g><g><rect x="60" y="755" width="320" height="200" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="84" y="795" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Fontes oficiais</text><text x="84" y="825" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Sistema externo · HTTPS</text><text x="84" y="867" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Receita, NF-e, CONFAZ,</text><text x="84" y="894" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">SEFAZ-SP e SEF-MG.</text><text x="84" y="921" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Downloads de manutenção.</text></g><g><rect x="500" y="320" width="420" height="230" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="524" y="360" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Servidor MCP + recuperação</text><text x="524" y="390" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Node.js 22 · TypeScript</text><text x="524" y="432" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Um processo: protocolo, consultas</text><text x="524" y="459" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">e índices construídos em memória.</text><text x="524" y="486" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Local: HTTP. AWS: Lambda.</text></g><g><rect x="500" y="755" width="420" height="220" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="524" y="795" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Worker de ingestão</text><text x="524" y="825" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Node.js · CLI de manutenção</text><text x="524" y="867" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Baixa snapshots; extrai e fragmenta.</text><text x="524" y="894" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Produz corpus.json e relatórios.</text><text x="524" y="921" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Executado fora das consultas.</text></g><g><rect x="1120" y="650" width="370" height="240" rx="12" fill="#e2f3f1" stroke="#16766e" stroke-width="2"/><text x="1144" y="690" font-size="27" fill="#124942" font-weight="600" text-anchor="start">Acervo versionado</text><text x="1144" y="720" font-size="19" fill="#286e66" font-weight="400" text-anchor="start">Arquivos JSON + snapshots</text><text x="1144" y="762" font-size="20" fill="#124942" font-weight="400" text-anchor="start">Texto, códigos, metadados e hashes.</text><text x="1144" y="789" font-size="20" fill="#124942" font-weight="400" text-anchor="start">corpus.json acompanha a Lambda.</text><text x="1144" y="816" font-size="20" fill="#124942" font-weight="400" text-anchor="start">Não é um banco vetorial remoto.</text></g><g><rect x="1120" y="300" width="370" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="1144" y="340" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Página e política</text><text x="1144" y="370" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">HTML · S3 + CloudFront</text><text x="1144" y="412" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">Conteúdo estático da demonstração.</text><text x="1144" y="439" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">Não executa a pesquisa MCP.</text></g><rect x="402.5" y="348" width="75" height="57" rx="6" fill="#f8fafc"/><text x="440" y="368" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">MCP</text><text x="440" y="393" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">HTTPS</text><rect x="663" y="150" width="234" height="32" rx="6" fill="#f8fafc"/><text x="780" y="170" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">HTTPS · página e política</text><rect x="969" y="570" width="102" height="57" rx="6" fill="#f8fafc"/><text x="1020" y="590" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Lê corpus</text><text x="1020" y="615" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">ao iniciar</text><rect x="952.5" y="805" width="135" height="57" rx="6" fill="#f8fafc"/><text x="1020" y="825" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Grava corpus</text><text x="1020" y="850" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">e snapshots</text><rect x="386" y="790" width="108" height="57" rx="6" fill="#f8fafc"/><text x="440" y="810" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Download</text><text x="440" y="835" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">HTTPS</text>
