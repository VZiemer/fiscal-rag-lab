terface / port</text><text x="674" y="332" font-size="21" fill="#153c62" font-weight="400" text-anchor="start">add(id, vector, payload)</text><text x="674" y="359" font-size="21" fill="#153c62" font-weight="400" text-anchor="start">search(query, k) → SearchHit&lt;T&gt;[]</text><text x="674" y="386" font-size="21" fill="#153c62" font-weight="400" text-anchor="start">size() → number</text></g><g><rect x="70" y="690" width="430" height="230" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="94" y="730" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">BruteForceIndex&lt;T&gt;</text><text x="94" y="760" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Class · active at endpoint</text><text x="94" y="802" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Vector Map; exhaustive search.</text><text x="94" y="829" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">serialize() / deserialize()</text><text x="94" y="856" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Restorable library snapshot.</text></g><g><rect x="585" y="690" width="430" height="230" rx="12" fill="#fff4df" stroke="#b5812a" stroke-width="2"/><text x="609" y="730" font-size="27" fill="#674a15" font-weight="600" text-anchor="start">IvfIndex&lt;T&gt;</text><text x="609" y="760" font-size="19" fill="#7d632e" font-weight="400" text-anchor="start">Class · experiment</text><text x="609" y="802" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">Custom K-Means forms groups.</text><text x="609" y="829" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">nlist / nprobe control search.</text><text x="609" y="856" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">May miss relevant neighbors.</text></g><g><rect x="1100" y="690" width="430" height="230" rx="12" fill="#fff4df" stroke="#b5812a" stroke-width="2"/><text x="1124" y="730" font-size="27" fill="#674a15" 