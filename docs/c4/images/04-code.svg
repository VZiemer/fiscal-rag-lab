nterface / porta</text><text x="674" y="332" font-size="21" fill="#153c62" font-weight="400" text-anchor="start">add(id, vector, payload)</text><text x="674" y="359" font-size="21" fill="#153c62" font-weight="400" text-anchor="start">search(query, k) → SearchHit&lt;T&gt;[]</text><text x="674" y="386" font-size="21" fill="#153c62" font-weight="400" text-anchor="start">size() → number</text></g><g><rect x="70" y="690" width="430" height="230" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="94" y="730" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">BruteForceIndex&lt;T&gt;</text><text x="94" y="760" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Classe · ativa no endpoint</text><text x="94" y="802" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Map de vetores; busca exaustiva.</text><text x="94" y="829" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">serialize() / deserialize()</text><text x="94" y="856" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Snapshot restaurável da biblioteca.</text></g><g><rect x="585" y="690" width="430" height="230" rx="12" fill="#fff4df" stroke="#b5812a" stroke-width="2"/><text x="609" y="730" font-size="27" fill="#674a15" font-weight="600" text-anchor="start">IvfIndex&lt;T&gt;</text><text x="609" y="760" font-size="19" fill="#7d632e" font-weight="400" text-anchor="start">Classe · experimento</text><text x="609" y="802" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">K-Means próprio organiza grupos.</text><text x="609" y="829" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">nlist / nprobe controlam a busca.</text><text x="609" y="856" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">Pode perder vizinhos relevantes.</text></g><g><rect x="1100" y="690" width="430" height="230" rx="12" fill="#fff4df" stroke="#b5812a" stroke-width="2"/><text x="1124" y="730" font-size="27" fill="#674a15" font-weight="600" text-anchor="start">HnswIndex&lt;T&gt;</text><text x="1124" y="760" font-size="19" fill="#7d632e" font-weight="400" text-anchor="start">Classe · experimento</text><text x="1124" y="802" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">Grafo de vizinhos em camadas.</text><text x="1124" y="829" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">m / efConstruction / efSearch.</text><text x="1124" y="856" font-size="21" fill="#674a15" font-weight="400" text-anchor="start">Pode perder vizinhos relevantes.</text></g><g><rect x="585" y="1050" width="430" height="160" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="609" y="1090" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">cosineSimilarity(a, b)</text><text x="609" y="1120" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Função matemática própria</text><text x="609" y="1162" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Produto escalar dividido pelas normas.</text><text x="609" y="1189" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">A pontuação não é certeza fiscal.</text></g><rect x="501" y="272" width="118" height="32" rx="6" fill="#f8fafc"/><text x="560" y="292" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Usa a porta</text><rect x="224" y="565" width="122" height="32" rx="6" fill="#f8fafc"/><text x="285" y="585" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Implementa</text><rect x="739" y="565" width="122" height="32" rx="6" fill="#f8fafc"/><text x="800" y="585" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Implementa</text><rect x="1254" y="565" width="122" height="32" rx="6" fill="#f8fafc"/><text x="1315" y="585" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Implementa</text><rect x="239" y="990" width="92" height="32" rx="6" fill="#f8fafc"/><text x="285" y="1010" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Cosseno</text><rect x="754" y="965" width="92" height="32" rx="6" fill="#f8fafc"/><text x="800" y="985" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Cosseno</text><rect x="1269" y="990" width="92" height="32" rx="6" fill="#f8fafc"/><text x="1315" y="1010" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Cosseno</text>
