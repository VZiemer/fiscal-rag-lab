<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#54728c"/></marker><marker id="implements" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#f8fafc" stroke="#54728c"/></marker></defs>
<rect width="1600" height="1430" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="58" y="40" font-size="18" fill="#237c88" font-weight="700" text-anchor="start">C4 · LEVEL 3  /  FISCAL RAG LAB</text>
<text x="58" y="88" font-size="38" fill="#133653" font-weight="650" text-anchor="start">Server components</text>
<text x="58" y="126" font-size="22" fill="#536b80" font-weight="400" text-anchor="start">Inside the MCP + retrieval process; internal calls between TypeScript modules.</text>
<rect x="55" y="185" width="1490" height="1100" rx="18" fill="#edf2f8" stroke="#9baec0" stroke-width="2" stroke-dasharray="10 7"/><text x="77" y="219" font-size="20" fill="#516b83" font-weight="600" text-anchor="start">MCP server + retrieval · one Node.js / Lambda process</text>
<polyline points="625,350 440,350" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="800,450 800,665" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="625,410 520,410 520,705 440,705" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="975,350 1325,350 1325,665" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="975,755 1150,755" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="625,805 440,805" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="625,865 520,865 520,1150 440,1150" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="800,905 800,1060" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="975,865 1065,865 1065,1150 1150,1150" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="90" y="260" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="114" y="300" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Contracts and validation</text><text x="114" y="330" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">ObjectContract · Standard Schema</text><text x="114" y="372" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">Fields, formats and limits.</text><text x="114" y="399" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">Zod encapsulated in one module.</text></g><g><rect x="625" y="260" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="649" y="300" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">MCP / HTTP adapter</text><text x="649" y="330" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">server.ts · lambda.ts</text><text x="649" y="372" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Exposes four read-only tools.</text><text x="649" y="399" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Validates and dispatches calls.</text></g><g><rect x="90" y="665" width="350" height="200" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="114" y="705" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">MemoryCorpus</text><text x="114" y="735" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">CorpusRepository</text><text x="114" y="777" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">In-memory texts, provenance</text><text x="114" y="804" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">and relationships; lookup by ID.</text></g><g><rect x="625" y="665" width="350" height="240" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="649" y="705" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">HybridRetriever</text><text x="649" y="735" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">packages/retrieval</text><text x="649" y="777" font-size="19" fill="#ffffff" font-weight="400" text-anchor="start">Routes queries; filters jurisdiction</text><text x="649" y="804" font-size="19" fill="#ffffff" font-weight="400" text-anchor="start">and validity; combines through RRF</text><text x="649" y="831" font-size="19" fill="#ffffff" font-weight="400" text-anchor="start">and attaches related evidence.</text></g><g><rect x="1150" y="665" width="350" height="210" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="1174" y="705" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">InMemoryFiscalRepository</text><text x="1174" y="735" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">FiscalRuleRepository</text><text x="1174" y="777" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Exact CFOP/NCM lookup</text><text x="1174" y="804" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">with editions and validity limits.</text></g><g><rect x="90" y="1060" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="114" y="1100" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">HashEmbeddingProvider</text><text x="114" y="1130" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">EmbeddingProvider · default</text><text x="114" y="1172" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Hash counts: 128 dimensions.</text><text x="114" y="1199" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">No learned semantics.</text></g><g><rect x="625" y="1060" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="649" y="1100" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Bm25Index</text><text x="649" y="1130" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Custom lexical index</text><text x="649" y="1172" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Inverted word lists</text><text x="649" y="1199" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">and BM25 scoring.</text></g><g><rect x="1150" y="1060" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="1174" y="1100" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">BruteForceIndex</text><text x="1174" y="1130" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">VectorIndex · default</text><text x="1174" y="1172" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Compares every vector</text><text x="1174" y="1199" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">using cosine similarity.</text></g><rect x="438.5" y="295" width="183" height="32" rx="6" fill="#f8fafc"/><text x="530" y="315" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Validates contracts</text><rect x="710" y="530" width="180" height="32" rx="6" fill="#f8fafc"/><text x="800" y="550" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">search_regulations</text><rect x="458.5" y="555" width="123" height="32" rx="6" fill="#f8fafc"/><text x="520" y="575" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">explain_rule</text><rect x="1277.5" y="505" width="95" height="57" rx="6" fill="#f8fafc"/><text x="1325" y="525" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">get_cfop</text><text x="1325" y="550" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">get_ncm</text><rect x="1012.5" y="693" width="105" height="57" rx="6" fill="#f8fafc"/><text x="1065" y="713" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Complete</text><text x="1065" y="738" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">code</text><rect x="456" y="752" width="148" height="32" rx="6" fill="#f8fafc"/><text x="530" y="772" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Excerpts / links</text><rect x="457" y="965" width="126" height="57" rx="6" fill="#f8fafc"/><text x="520" y="985" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Embeds text</text><text x="520" y="1010" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">and query</text><rect x="761.5" y="960" width="77" height="32" rx="6" fill="#f8fafc"/><text x="800" y="980" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Words</text><rect x="1023" y="965" width="84" height="32" rx="6" fill="#f8fafc"/><text x="1065" y="985" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Vectors</text>
<line x1="58" y1="1365" x2="1542" y2="1365" stroke="#c9d6e2"/>
<text x="58" y="1400" font-size="20" fill="#536b80" font-weight="400" text-anchor="start">loadServices composes services. Indexes are built at corpus load and reused within the instance.</text>
</g></svg>