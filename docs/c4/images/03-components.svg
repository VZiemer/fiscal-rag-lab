" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Adaptador MCP / HTTP</text><text x="649" y="330" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">server.ts · lambda.ts</text><text x="649" y="372" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">Expõe quatro ferramentas de leitura.</text><text x="649" y="399" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">Valida e encaminha chamadas.</text></g><g><rect x="90" y="665" width="350" height="200" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="114" y="705" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">MemoryCorpus</text><text x="114" y="735" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">CorpusRepository</text><text x="114" y="777" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Textos, proveniência e relações</text><text x="114" y="804" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">em memória; acesso por ID.</text></g><g><rect x="625" y="665" width="350" height="240" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="649" y="705" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">HybridRetriever</text><text x="649" y="735" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">packages/retrieval</text><text x="649" y="777" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Roteia consulta; filtra jurisdição</text><text x="649" y="804" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">e vigência; combina por RRF</text><text x="649" y="831" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">e reúne evidências relacionadas.</text></g><g><rect x="1150" y="665" width="350" height="210" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="1174" y="705" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">InMemoryFiscalRepository</text><text x="1174" y="735" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">FiscalRuleRepository</text><text x="1174" y="777" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">Consulta exata CFOP/NCM</text><text x="1174" y="804" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">com versões e limites de vigência.</text></g><g><rect x="90" y="1060" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="114" y="1100" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">HashEmbeddingProvider</text><text x="114" y="1130" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">EmbeddingProvider · padrão</text><text x="114" y="1172" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">Contagens por hash: 128 dimensões.</text><text x="114" y="1199" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">Sem semântica aprendida.</text></g><g><rect x="625" y="1060" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="649" y="1100" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Bm25Index</text><text x="649" y="1130" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Índice lexical próprio</text><text x="649" y="1172" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Listas invertidas de palavras</text><text x="649" y="1199" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">e pontuação BM25.</text></g><g><rect x="1150" y="1060" width="350" height="190" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="1174" y="1100" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">BruteForceIndex</text><text x="1174" y="1130" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">VectorIndex · padrão</text><text x="1174" y="1172" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Compara todos os vetores</text><text x="1174" y="1199" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">por similaridade de cosseno.</text></g><rect x="449.5" y="295" width="161" height="32" rx="6" fill="#f8fafc"/><text x="530" y="315" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Valida contratos</text><rect x="710" y="530" width="180" height="32" rx="6" fill="#f8fafc"/><text x="800" y="550" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">search_regulations</text><rect x="458.5" y="555" width="123" height="32" rx="6" fill="#f8fafc"/><text x="520" y="575" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">explain_rule</text><rect x="1277.5" y="505" width="95" height="57" rx="6" fill="#f8fafc"/><text x="1325" y="525" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">get_cfop</text><text x="1325" y="550" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">get_ncm</text><rect x="1013.5" y="693" width="103" height="57" rx="6" fill="#f8fafc"/><text x="1065" y="713" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Código</text><text x="1065" y="738" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">completo</text><rect x="442.5" y="752" width="175" height="32" rx="6" fill="#f8fafc"/><text x="530" y="772" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Trechos / relações</text><rect x="445.5" y="965" width="149" height="57" rx="6" fill="#f8fafc"/><text x="520" y="985" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Vetoriza textos</text><text x="520" y="1010" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">e consulta</text><rect x="755" y="960" width="90" height="32" rx="6" fill="#f8fafc"/><text x="800" y="980" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Palavras</text><rect x="1022.5" y="965" width="85" height="32" rx="6" fill="#f8fafc"/><text x="1065" y="985" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Vetores</text>
