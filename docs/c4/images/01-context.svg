<text x="58" y="88" font-size="38" fill="#133653" font-weight="650" text-anchor="start">System context</text>
<text x="58" y="126" font-size="22" fill="#536b80" font-weight="400" text-anchor="start">Who uses the lab and which external systems it interacts with.</text>

<polyline points="400,310 600,310" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="810,400 810,580" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1020,640 1100,640 1100,495 1190,495" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1020,750 1100,750 1100,815 1190,815" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/><g><rect x="70" y="220" width="330" height="180" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="94" y="260" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Researcher</text><text x="94" y="290" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Person</text><text x="94" y="332" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Asks questions and reviews</text><text x="94" y="359" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">context and evidence.</text></g><g><rect x="600" y="220" width="420" height="180" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="624" y="260" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">MCP client / assistant</text><text x="624" y="290" font-size="19" fill="#506579" font-weight="400" text-anchor="start">External system</text><text x="624" y="332" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Conducts conversations, calls tools</text><text x="624" y="359" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">and writes evidence-based answers.</text></g><g><rect x="600" y="580" width="420" height="220" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="624" y="620" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Fiscal RAG Lab</text><text x="624" y="650" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">System of interest</text><text x="624" y="692" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Retrieves tax codes and texts</text><text x="624" y="719" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">with source, edition and validity.</text><text x="624" y="746" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Does not generate the LLM answer.</text></g><g><rect x="1190" y="390" width="350" height="210" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="1214" y="430" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Official sources</text><text x="1214" y="460" font-size="19" fill="#506579" font-weight="400" text-anchor="start">External system · HTTPS</text><text x="1214" y="502" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Receita, NF-e, CONFAZ,</text><text x="1214" y="529" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">SEFAZ-SP and SEF-MG.</text><text x="1214" y="556" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Maintenance downloads.</text></g><g><rect x="1190" y="720" width="350" height="190" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="1214" y="760" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Ollama runtime</text><text x="1214" y="790" font-size="19" fill="#506579" font-weight="400" text-anchor="start">External system · optional</text><text x="1214" y="832" font-size="19" fill="#263c50" font-weight="400" text-anchor="start">Learned embeddings, if configured.</text><text x="1214" y="859" font-size="19" fill="#263c50" font-weight="400" text-anchor="start">Not used by the current Lambda.</text></g><rect x="426" y="258" width="148" height="32" rx="6" fill="#f8fafc"/><text x="500" y="278" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Asks questions</text><rect x="743" y="455" width="134" height="57" rx="6" fill="#f8fafc"/><text x="810" y="475" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Calls tools</text><text x="810" y="500" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">MCP / HTTPS</text><rect x="1034.5" y="400" width="131" height="57" rx="6" fill="#f8fafc"/><text x="1100" y="420" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Maintenance</text><text x="1100" y="445" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">collection</text><rect x="993.5" y="855" width="153" height="57" rx="6" fill="#f8fafc"/><text x="1070" y="875" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Optional</text><text x="1070" y="900" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Embedding API</text>
<line x1="58" y1="955" x2="1542" y2="955" stroke="#c9d6e2"/>
<text x="58" y="990" font-size="20" fill="#536b80" font-weight="400" text-anchor="start">Official sources are accessed during ingestion. Tax queries use the loaded corpus.</text>
