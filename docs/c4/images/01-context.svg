<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#54728c"/></marker><marker id="implements" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#f8fafc" stroke="#54728c"/></marker></defs>
<rect width="1600" height="1020" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="58" y="40" font-size="18" fill="#237c88" font-weight="700" text-anchor="start">C4 · NÍVEL 1  /  FISCAL RAG LAB</text>
<text x="58" y="88" font-size="38" fill="#133653" font-weight="650" text-anchor="start">Contexto do sistema</text>
<text x="58" y="126" font-size="22" fill="#536b80" font-weight="400" text-anchor="start">Quem usa o laboratório e com quais sistemas ele se relaciona.</text>

<polyline points="400,310 600,310" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="810,400 810,580" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1020,640 1100,640 1100,495 1190,495" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1020,750 1100,750 1100,815 1190,815" fill="none" stroke="#54728c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/><g><rect x="70" y="220" width="330" height="180" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="94" y="260" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Pessoa pesquisadora</text><text x="94" y="290" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Pessoa</text><text x="94" y="332" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Formula perguntas e confere</text><text x="94" y="359" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">o contexto e as evidências.</text></g><g><rect x="600" y="220" width="420" height="180" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="624" y="260" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Cliente MCP / assistente</text><text x="624" y="290" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Sistema externo</text><text x="624" y="332" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Conduz a conversa, chama ferramentas</text><text x="624" y="359" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">e redige a resposta com evidências.</text></g><g><rect x="600" y="580" width="420" height="220" rx="12" fill="#184e78" stroke="#123b5b" stroke-width="2"/><text x="624" y="620" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Fiscal RAG Lab</text><text x="624" y="650" font-size="19" fill="#c7e0f2" font-weight="400" text-anchor="start">Sistema de interesse</text><text x="624" y="692" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Recupera códigos e textos fiscais</text><text x="624" y="719" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">com fonte, edição e vigência.</text><text x="624" y="746" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Não gera a resposta final da LLM.</text></g><g><rect x="1190" y="390" width="350" height="210" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="1214" y="430" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Fontes oficiais</text><text x="1214" y="460" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Sistema externo · HTTPS</text><text x="1214" y="502" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Receita, NF-e, CONFAZ,</text><text x="1214" y="529" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">SEFAZ-SP e SEF-MG.</text><text x="1214" y="556" font-size="21" fill="#263c50" font-weight="400" text-anchor="start">Downloads de manutenção.</text></g><g><rect x="1190" y="720" width="350" height="190" rx="12" fill="#e8edf3" stroke="#96a5b5" stroke-width="2"/><text x="1214" y="760" font-size="27" fill="#263c50" font-weight="600" text-anchor="start">Runtime Ollama</text><text x="1214" y="790" font-size="19" fill="#506579" font-weight="400" text-anchor="start">Sistema externo · opcional</text><text x="1214" y="832" font-size="16" fill="#263c50" font-weight="400" text-anchor="start">Embeddings aprendidos, se configurado.</text><text x="1214" y="859" font-size="16" fill="#263c50" font-weight="400" text-anchor="start">Não utilizado na Lambda atual.</text></g><rect x="430" y="258" width="140" height="32" rx="6" fill="#f8fafc"/><text x="500" y="278" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Faz perguntas</text><rect x="716" y="455" width="188" height="57" rx="6" fill="#f8fafc"/><text x="810" y="475" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Chama ferramentas</text><text x="810" y="500" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">MCP / HTTPS</text><rect x="1037" y="400" width="126" height="57" rx="6" fill="#f8fafc"/><text x="1100" y="420" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Coleta na</text><text x="1100" y="445" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">manutenção</text><rect x="975" y="855" width="190" height="57" rx="6" fill="#f8fafc"/><text x="1070" y="875" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">Opcional</text><text x="1070" y="900" font-size="20" fill="#34536c" font-weight="500" text-anchor="middle">API de embeddings</text>
<line x1="58" y1="955" x2="1542" y2="955" stroke="#c9d6e2"/>
<text x="58" y="990" font-size="20" fill="#536b80" font-weight="400" text-anchor="start">Fontes oficiais são acessadas na ingestão. A consulta fiscal usa o corpus já carregado.</text>
</g></svg>